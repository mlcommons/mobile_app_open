name: iOS App Store Validation

# Reproduces Xcode Cloud's "Preparing build for App Store Connect" step.
#
# That step rejects bundles which xcodebuild itself accepts: in Xcode Cloud
# build 265 the archive succeeded and all three exports (ad-hoc, app-store,
# development) reported EXPORT SUCCEEDED, yet the build still failed afterwards.
# The ITMS checks that reject it run on Apple's servers, so building and
# exporting in CI would come back green and prove nothing. This workflow goes
# one step further and submits the .ipa to the validation service with
# `altool --validate-app`, which runs the same checks and returns the same
# error codes without publishing a build.
#
# It is deliberately not part of the per-PR iOS job: it needs a full production
# build plus a round trip to Apple, so it runs on demand and on changes that can
# alter what ends up inside Runner.app.

on:
  workflow_dispatch:
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - 'flutter/ios/**'
      - 'flutter/*.mk'
      - 'mobile_back_*/**/ios/**'
      - 'mobile_back_*/*.mk'
      - '.github/workflows/ios-appstore-validate.yml'
  push:
    branches: [ master, submission-v* ]

jobs:
  computed:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Compute build number
        id: set
        env:
          OFFSET: ${{ vars.FLUTTER_BUILD_NUMBER_OFFSET }}
        run: echo "build_number=$((GITHUB_RUN_NUMBER + ${OFFSET:-0}))" >> "$GITHUB_OUTPUT"
    outputs:
      build_number: ${{ steps.set.outputs.build_number }}

  validate:
    name: Validate App Store build
    needs: computed
    runs-on: macos-15
    permissions:
      contents: read
    timeout-minutes: 180
    env:
      FLUTTER_BUILD_NUMBER: ${{ needs.computed.outputs.build_number }}
      OFFICIAL_BUILD: false
      # Match the Xcode Cloud workflow, which builds all three iOS backends.
      # The payload has to be identical to the one Apple rejected, or the
      # validation result says nothing about it.
      WITH_APPLE: 1
      WITH_TFLITE: 1
      WITH_LITERT: 1
      WITH_PIXEL: 0
      WITH_MEDIATEK: 0
      WITH_QTI: 0
      WITH_SAMSUNG: 0
      FIREBASE_IOS_API_KEY: ${{ secrets.FIREBASE_IOS_API_KEY }}
      FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
      FIREBASE_IOS_CLIENT_ID: ${{ secrets.FIREBASE_IOS_CLIENT_ID }}
      FIREBASE_IOS_REVERSED_CLIENT_ID: ${{ secrets.FIREBASE_IOS_REVERSED_CLIENT_ID }}
      FIREBASE_IOS_BUNDLE_ID: ${{ secrets.FIREBASE_IOS_BUNDLE_ID }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      FIREBASE_CRASHLYTICS_ENABLED: false
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Select Xcode with iOS 26.1 SDK
        # Same constraint as the iOS build job: device_info_plus calls an
        # iOS 26.1 API that must be declared by the SDK at compile time.
        run: |
          set -euo pipefail
          XCODE_APP=$(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "No Xcode 26.x found on the runner" >&2
            exit 1
          fi
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
      - name: Cache CocoaPods
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ github.workspace }}/flutter/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-
      - name: Cache bazel
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /tmp/bazel_cache
          key: ${{ runner.os }}-bazel_cache-${{ hashFiles('**/BUILD', '**/WORKSPACE') }}
          restore-keys: ${{ runner.os }}-bazel_cache-
      - name: Install the Apple certificate and API key
        env:
          IOS_BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          IOS_BUILD_CERTIFICATE_PASSWORD: ${{ secrets.IOS_BUILD_CERTIFICATE_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          AUTH_KEY_PATH=$RUNNER_TEMP/AuthKey.p8

          if [ -z "$APP_STORE_CONNECT_API_KEY_BASE64" ]; then
            echo "APP_STORE_CONNECT_API_KEY_BASE64 is required: automatic App Store"
            echo "signing and altool validation both authenticate with it."
            exit 1
          fi

          echo -n "$IOS_BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          # Accept either raw .p8 content or base64-encoded .p8 content.
          if printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$APP_STORE_CONNECT_API_KEY_BASE64" > "$AUTH_KEY_PATH"
          else
            printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode -o "$AUTH_KEY_PATH"
          fi
          # Normalize line endings; CRLF keys can fail parsing in some tooling.
          tr -d '\r' < "$AUTH_KEY_PATH" > "$AUTH_KEY_PATH.tmp"
          mv "$AUTH_KEY_PATH.tmp" "$AUTH_KEY_PATH"
          if ! openssl pkey -in "$AUTH_KEY_PATH" -noout >/dev/null 2>&1; then
            echo "Decoded App Store Connect API key is not a valid private key."
            exit 1
          fi

          # altool resolves the key by ID, not by path, and only looks in
          # ./private_keys, ~/private_keys, ~/.private_keys and
          # ~/.appstoreconnect/private_keys.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$AUTH_KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_BUILD_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # An App Store archive must be signed with a distribution identity.
          # Say so up front rather than failing later inside xcodebuild.
          echo "Signing identities available to this keychain:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Apple Distribution"; then
            echo "::warning::No 'Apple Distribution' identity found. IOS_BUILD_CERTIFICATE_BASE64 looks like a development certificate; the archive step will fail to sign for App Store distribution."
          fi
      - name: Build backends and Flutter packages
        env:
          BAZEL_OUTPUT_ROOT_ARG: "--output_user_root=/tmp/bazel_output"
          BAZEL_CACHE_ARG: "--disk_cache=/tmp/bazel_cache"
        run: |
          cd flutter/ios/ci_scripts/ && bash ci_post_clone.sh
      - name: Archive and export for App Store Connect
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
        run: |
          export APP_STORE_CONNECT_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          make flutter/ios/appstore/archive
          make flutter/ios/appstore/export
      - name: Validate against App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
        run: |
          # pipefail so tee does not mask altool's exit status: a rejected
          # bundle has to fail this step. The report is still uploaded by the
          # always() step below.
          set -o pipefail
          make flutter/ios/appstore/validate 2>&1 | tee "$RUNNER_TEMP/altool-validate.log"
      - name: Upload validation report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-appstore-validation-${{ needs.computed.outputs.build_number }}
          path: |
            ${{ runner.temp }}/altool-validate.log
            output/flutter/ios/ExportOptions-appstore.plist
          retention-days: 28
          if-no-files-found: warn
      - name: Clean up keychain and API key
        if: ${{ always() }}
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f $RUNNER_TEMP/AuthKey.p8
          rm -rf $HOME/.appstoreconnect/private_keys
