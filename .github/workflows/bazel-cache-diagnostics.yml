name: Bazel Cache Diagnostics

# Measures whether bazel action keys are reproducible across CI runs, which is
# what a shared remote cache needs in order to hit anything. See
# .github/workflows/scripts/bazel-cache-probe.sh for what is collected and why.
#
# Deliberately cheap: it builds one small canary target instead of the full
# backend set, and leans on `bazel aquery` (analysis only) for the ground truth
# about action keys. A run takes minutes, not the ~70 the real build job needs.

permissions:
  contents: read
  packages: read

on:
  workflow_dispatch:
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - '.github/workflows/bazel-cache-diagnostics.yml'
      - '.github/workflows/scripts/bazel-cache-probe.sh'
      - '.bazelrc'
      - '.bazelversion'
      - 'WORKSPACE'

concurrency:
  group: bazel-cache-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-22.04-4core
    # Same image the real build job uses. `latest` is pushed by every run of
    # android-build-test-linux.yml, and pulling it (instead of rebuilding)
    # keeps the probe fast and keeps the image constant between probe runs.
    container:
      image: ghcr.io/mlcommons/mobile_app_open-android:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 90
    env:
      BAZEL_OUTPUT_ROOT_ARG: "--output_user_root=/tmp/bazel_output"
      # A prefix of its own, so the probe neither pollutes nor is polluted by
      # the cache the real build job uses.
      BAZEL_CACHE_ARG: "--remote_cache=https://storage.googleapis.com/mobile-app-build-290400_github-actions/bazel-cache/probe --google_default_credentials"
      DIAG_GCS_PREFIX: gs://mobile-app-build-290400_github-actions/bazel-cache-diagnostics
      CANARY_TARGET: "//flutter/cpp:mlperf_driver"
      PROBE_OUT_DIR: /tmp/bazel-cache-probe
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # Preinstalled tools from the host at `/opt/hostedtoolcache` are not
      # needed since we run inside our own container; `/__t` is that mount.
      - name: Free up disk space
        run: |
          df -h
          rm -rf /__t/*
          df -h
      - name: Configure Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Set up authentication for Google Cloud SDK
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_MOBILE_APP_BUILD }}
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '>= 363.0.0'
          project_id: mobile-app-build-290400
      - name: Run bazel cache probe
        run: bash .github/workflows/scripts/bazel-cache-probe.sh
      - name: Archive probe bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bazel-cache-probe-${{ github.run_number }}
          path: /tmp/bazel-cache-probe
          retention-days: 14
          if-no-files-found: warn
